<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://thymleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Task Details</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
  </head>
  <!-- Responsive navbar-->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container px-5">
      <a class="navbar-brand" href="#!">To Do List</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#!">Home</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/task/new}">Create</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <body class="d-flex flex-column h-100">
        <div class="container px-4 px-lg-5 my-5">
          <div class="row gx-4 gx-lg-5 align-items-center">
            <div class="col-md-6">
              <img
                class="card-img-top mb-5 mb-md-0"
                src="https://cdn-icons-png.flaticon.com/512/2098/2098402.png"
                />
            </div>
            <div class="col-md-6">
              <div th:text="${task.title}" class="small mb-1"></div>
              <h1
                th:text="${task.description}"
                class="display-5 fw-bolder"
              ></h1>
              <div class="fs-5 mb-5">
                <span > Start :</span>
                <span th:text="${task.startTime}"></span>
              </div>
              <div class="fs-5 mb-5">
                <span >End :</span>
                <span th:text="${task.endTime}"></span>
              </div>
              <div class="d-flex">
  </body>
  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core theme JS-->
  <script th:src="@{/js/scripts.js}"></script>
</html>
